name: Cache prune

# 快取清理的備援入口。主要清理掛在 ci.yml／release.yml 的收尾步驟，這裡只處理
# 漏網的項目：手動 dispatch 預設 dry-run，排程每天真的刪。
on:
  schedule:
    - cron: "0 3 * * *" # 每天 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: 只列出要刪的，不真的刪

permissions:
  actions: write
  contents: read

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune:
    name: prune
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP_PER_FAMILY: "1"
      MAX_IDLE_DAYS: "7"
      SKIP_RECENT_HOURS: "1"
      MAX_TOTAL_GB: "8"
    steps:
      - uses: actions/checkout@v5

      - name: 清理舊快取
        env:
          # 手動觸發時尊重 dry_run 輸入；排程觸發時 inputs 是空的，預設真的刪。
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${DRY_RUN_INPUT}" == "true" ]]; then
            args+=(--dry-run)
          fi
          bash scripts/cache-prune.sh "${args[@]}"
