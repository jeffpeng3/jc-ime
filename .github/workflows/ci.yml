name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  # 增量編譯對 CI 沒有好處，關掉可少寫很多暫存檔。
  CARGO_INCREMENTAL: 0

jobs:
  # 與測試並行起步。主動抓 tag 並用完整 SHA 比對，決定要不要接著發版。
  # fetch-depth: 0 讓 annotated tag 的 peel 資訊完整。
  check-tag:
    name: check-tag（版本標籤檢查）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_tag: ${{ steps.tag.outputs.has_tag }}
      version: ${{ steps.tag.outputs.version }}
      iso_version: ${{ steps.tag.outputs.iso_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # push --follow-tags 的 commit 與 annotated tag 可能先後到達 runner；
          # 明确抓 tag，讓 check-tag 不依賴 checkout 的預設行為。
          fetch-tags: true

      - name: 檢查 commit 的版本標籤
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          # checkout 的 fetch-tags 遇上 push --follow-tags 的 race 仍可能漏掉 tag；
          # 主動 fetch，再用完整 SHA 比對，tag 比 commit 晚到時重試。
          commit_sha="${{ github.sha }}"
          for attempt in 1 2 3; do
            if ! git fetch --tags --force origin >/dev/null 2>&1; then
              echo "::warning::第 ${attempt} 次 git fetch --tags origin 失敗。"
            fi
            mapfile -t v_tags < <(git tag --points-at "${commit_sha}" | grep '^v' || true)
            if [[ ${#v_tags[@]} -gt 0 ]]; then
              break
            fi
            if [[ ${attempt} -lt 3 ]]; then
              echo "commit ${commit_sha} 還沒有 v* 標籤；等 3 秒後重試 fetch。"
              sleep 3
            fi
          done

          cargo_version=$(python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          section = re.search(r"^\[workspace\.package\]\s*$", text, re.M)
          if not section:
              raise SystemExit("Cargo.toml 找不到 [workspace.package]")
          body = text[section.end():]
          next_section = re.search(r"^\[", body, re.M)
          if next_section:
              body = body[:next_section.start()]
          version = re.search(r'^version\s*=\s*"([^"]+)"', body, re.M)
          if not version:
              raise SystemExit("[workspace.package] 找不到 version")
          print(version.group(1))
          PY
          )

          if [[ ${#v_tags[@]} -eq 0 ]]; then
            echo "commit ${commit_sha} 沒有 v* 標籤；一般 push 只跑測試。"
            echo "workflow_dispatch 手動安裝 smoke 需要版本，仍輸出 Cargo.toml 的版本。"
            echo "has_tag=false" >> "${GITHUB_OUTPUT}"
            echo "version=${cargo_version}" >> "${GITHUB_OUTPUT}"
            echo "iso_version=${cargo_version%%-*}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ ${#v_tags[@]} -gt 1 ]]; then
            echo "::error::commit ${commit_sha} 有多個 v* 標籤：${v_tags[*]}；發版需要單一版本標籤。"
            exit 1
          fi

          tag="${v_tags[0]}"
          version="${tag#v}"
          if [[ "${version}" != "${cargo_version}" ]]; then
            echo "::error::標籤版本 ${version} 與 Cargo.toml 的 ${cargo_version} 不一致"
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本 ${version} 不是 x.y.z 或 x.y.z-<pre-release>"
            exit 1
          fi
          iso_version="${version%%-*}"

          echo "標籤：${tag}；版本：${version}；VersionInfoVersion：${iso_version}"
          {
            echo "has_tag=true"
            echo "version=${version}"
            echo "iso_version=${iso_version}"
          } >> "${GITHUB_OUTPUT}"

  linux:
    name: linux (core)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 收尾清理需要刪快取的權限；job 層級覆蓋 workflow 的 contents: read。
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      # 版本由 rust-toolchain.toml 決定；這裡寫死同一版，因為 action 不會讀
      # 該檔案。兩邊要一起改（見 docs/port/toolchain-pin.md）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          # Windows 目標的型別檢查用；不需要 MSVC 工具鏈。
          targets: x86_64-pc-windows-msvc
      - name: 工具鏈版本與 rust-toolchain.toml 一致
        run: |
          pinned=$(python3 -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          active=$(rustc --version | cut -d' ' -f2)
          if [[ "${active}" != "${pinned}" ]]; then
            echo "::error::rustc ${active} 與 rust-toolchain.toml 的 ${pinned} 不一致"
            exit 1
          fi
          echo "rustc ${active}（rust-toolchain.toml）"
      - name: 系統依賴（GPUI Kit 的 X11／Wayland／字型）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev
      # 依賴建置快取。CI 連 workspace crate 的產物一起快取：每個 commit 通常只改
      # 幾個 crate，還原後 cargo 只重編有變的。key 不含 commit SHA，同一份
      # Cargo.lock／rustc 下只會存第一次，之後都是還原後增量重建。
      # 第一次跑不會命中（見 docs/release.md 的快取章節）。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux
          cache-targets: "true"
          cache-all-crates: "true"
          cache-on-failure: "true"
      # 部署環境一定有資料根目錄，CI 不能在「沒有資料」的降級環境跑測試。
      # 兩個 repo variable 都是公開的，fork PR 也讀得到；任一為空就明確失敗。
      - name: 下載並展開資料包
        shell: bash
        env:
          DATA_BUNDLE_URL: ${{ vars.JC_DATA_BUNDLE_URL }}
          DATA_BUNDLE_SHA256: ${{ vars.JC_DATA_BUNDLE_SHA256 }}
        run: |
          set -euo pipefail

          if [[ -z "${DATA_BUNDLE_URL//[[:space:]]/}" ]]; then
            echo "::error::repo variable JC_DATA_BUNDLE_URL 為空；CI 不能在沒有資料的環境跑測試。"
            exit 1
          fi
          if [[ -z "${DATA_BUNDLE_SHA256//[[:space:]]/}" ]]; then
            echo "::error::repo variable JC_DATA_BUNDLE_SHA256 為空；不允許跳過資料包雜湊檢查。"
            exit 1
          fi

          bundle="${RUNNER_TEMP}/jc-ime-data-bundle"
          curl -fsSL --retry 5 -o "${bundle}" "${DATA_BUNDLE_URL}"

          expected=$(printf '%s' "${DATA_BUNDLE_SHA256}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          actual=$(sha256sum "${bundle}" | awk '{print $1}')
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::資料包 SHA-256 不符：預期 ${expected}，實際 ${actual}"
            exit 1
          fi
          echo "資料包 SHA-256 通過：${actual}"

          root="${RUNNER_TEMP}/jc-ime-data"
          rm -rf "${root}"
          mkdir -p "${root}"
          tar -xf "${bundle}" -C "${root}"

          # 允許壓縮檔多一層 jc-ime-data/；只找根目錄或其下一層的 manifest.json，
          # 避免誤選模組自己的 manifest（例如 models/ 底下那些）。
          data_root="${root}"
          if [[ ! -f "${data_root}/manifest.json" ]]; then
            candidates=()
            for dir in "${root}"/*/; do
              if [[ -f "${dir}manifest.json" ]]; then
                candidates+=("${dir%/}")
              fi
            done
            if [[ ${#candidates[@]} -eq 1 ]]; then
              data_root="${candidates[0]}"
            fi
          fi
          if [[ ! -f "${data_root}/manifest.json" ]]; then
            echo "::error::資料包裡找不到 manifest.json（解開位置：${root}）"
            exit 1
          fi

          data_version=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("version","unknown"))' \
            "${data_root}/manifest.json")
          echo "JC_IMEDATA=${data_root}" >> "${GITHUB_ENV}"
          echo "資料根目錄：${data_root}"
          echo "資料版本：${data_version}"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Windows 目標型別檢查
        # 用 Windows target 跑型別檢查，補上 Linux 建置看不到的 `cfg(windows)`
        # 分支。只做 check、不連結，所以 Linux runner 不需要 MSVC 工具鏈。
        #
        # 兩個 crate 不在這裡檢查，它們的 C 相依需要 MSVC 的 C 編譯器與 Windows
        # SDK，Linux runner 沒有：
        # - `jc-cli`：ureq → rustls → ring
        # - `jc-settings-ui`：GPUI（資源檔需要 resource compiler，另有 C 相依）
        # 這兩個 crate 的 Windows 建置由 windows (msvc) job 負責。
        run: >
          cargo check --workspace --all-targets
          --exclude jc-cli --exclude jc-settings-ui
          --target x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --workspace

      # 收尾清理舊快取：只在 main 跑，PR 不動快取。清理失敗不讓 build 變紅。
      # 並行 run 可能正在使用既有快取，所以跳過建立未滿 1 小時的項目；
      # 保護窗再長會讓每日多次發版的 tag 快取永遠清不掉。
      # 腳本會把判定與結果寫入 $GITHUB_STEP_SUMMARY，continue-on-error 也看得到。
      - name: 清理舊快取
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/cache-prune.sh --skip-recent-hours 1

  windows:
    name: windows (msvc)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # 與 rust-toolchain.toml 同一版（action 不讀該檔案）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      # 與 ci-linux 分開的 key，避免 Linux／Windows 互相覆蓋快取。
      # 快取量大，總量接近 10 GB 時優先關掉這個 job 的 cache-all-crates。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows
          cache-targets: "true"
          cache-all-crates: "true"
          cache-on-failure: "true"
      # 與 linux job 相同：用公開 repo variable 下載正式資料包；空值直接失敗。
      # 用 pwsh 是為了照 release.yml 的寫法，在 Windows tar 不支援 zstd 時退回 7-Zip。
      - name: 下載並展開資料包
        shell: pwsh
        env:
          DATA_BUNDLE_URL: ${{ vars.JC_DATA_BUNDLE_URL }}
          DATA_BUNDLE_SHA256: ${{ vars.JC_DATA_BUNDLE_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'

          $url = $env:DATA_BUNDLE_URL
          if ([string]::IsNullOrWhiteSpace($url)) {
            throw 'repo variable JC_DATA_BUNDLE_URL 為空；CI 不能在沒有資料的環境跑測試，請檢查 repo variables。'
          }
          $expected = $env:DATA_BUNDLE_SHA256
          if ([string]::IsNullOrWhiteSpace($expected)) {
            throw 'repo variable JC_DATA_BUNDLE_SHA256 為空；不允許跳過資料包雜湊檢查，請檢查 repo variables。'
          }

          $bundle = Join-Path $env:RUNNER_TEMP 'jc-ime-data-bundle'
          Invoke-WebRequest -Uri $url -OutFile $bundle

          $actual = (Get-FileHash -Algorithm SHA256 $bundle).Hash.ToLowerInvariant()
          $expected = $expected.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "資料包 SHA-256 不符：預期 $expected，實際 $actual"
          }
          Write-Host "資料包 SHA-256 通過：$actual"

          $root = Join-Path $env:RUNNER_TEMP 'jc-ime-data'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null

          if ($url -match '\.zip(\?|$)') {
            Expand-Archive -Path $bundle -DestinationPath $root -Force
          } else {
            & tar -xf $bundle -C $root
            if ($LASTEXITCODE -ne 0) {
              # Windows 內建 tar 不一定支援 zstd；照 release.yml 退回 7-Zip。
              if ($url -match '\.(zst|tzst)(\?|$)') {
                Write-Warning 'Windows tar 無法解 zstd；改用 7-Zip。'
                Remove-Item $root -Recurse -Force
                New-Item -ItemType Directory -Path $root | Out-Null

                $sevenZip = @(
                  (Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'),
                  (Join-Path ${env:ProgramFiles(x86)} '7-Zip\7z.exe')
                ) | Where-Object { Test-Path $_ } | Select-Object -First 1
                if (-not $sevenZip) {
                  throw '找不到 7-Zip，且 Windows tar 不支援 .tar.zst；請把資料包改成 .tar.gz。'
                }
                $sevenWork = Join-Path $env:RUNNER_TEMP 'jc-ime-data-7z'
                if (Test-Path $sevenWork) { Remove-Item $sevenWork -Recurse -Force }
                New-Item -ItemType Directory -Path $sevenWork | Out-Null

                & $sevenZip x $bundle "-o$sevenWork" -y
                if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip 解開 zstd 失敗（exit $LASTEXITCODE）"
                }
                $tarFile = Get-ChildItem -Path $sevenWork -Filter '*.tar' -File -Recurse |
                  Select-Object -First 1
                if (-not $tarFile) {
                  throw '7-Zip 沒有產出 .tar；請把資料包改成 .tar.gz。'
                }
                & $sevenZip x $tarFile.FullName "-o$root" -y
                if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip 解開 tar 失敗（exit $LASTEXITCODE）"
                }
              } else {
                throw "解開資料包失敗（tar exit $LASTEXITCODE）"
              }
            }
          }

          # 只找根目錄或其下一層，避免誤選模型目錄底下的 manifest.json。
          $dataRoot = $root
          if (-not (Test-Path (Join-Path $dataRoot 'manifest.json'))) {
            $candidates = @(Get-ChildItem -Path $root -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName 'manifest.json') })
            if ($candidates.Count -eq 1) {
              $dataRoot = $candidates[0].FullName
            }
          }
          if (-not (Test-Path (Join-Path $dataRoot 'manifest.json'))) {
            throw "資料包裡找不到 manifest.json（解開位置：$root）"
          }

          $manifest = Get-Content (Join-Path $dataRoot 'manifest.json') -Raw | ConvertFrom-Json
          $dataVersion = $manifest.version
          if ([string]::IsNullOrWhiteSpace($dataVersion)) { $dataVersion = 'unknown' }
          "JC_IMEDATA=$dataRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "資料根目錄：$dataRoot"
          Write-Host "資料版本：$dataVersion"
      # 只跑 test（debug）。release 建置由下面的 build-windows job 並行處理，
      # 不必等測試結束才起步。
      - name: Test
        run: cargo test --workspace

  # Windows 專屬的測試。上面的 windows job 只跑 x64 的 cargo test；這支 job
  # 補上三個缺口：
  # - 66 處 #[cfg(windows)] 的程式在 Linux 不會被編譯，這裡真的編譯並執行。
  # - Windows 專屬 crate 的 clippy（Linux 的 clippy 只看得到非 Windows 分支）。
  # - i686（32 位元 TSF DLL）的型別檢查，以及 installer/jc-tip-register 這個
  #   獨立 workspace 的測試。
  # 所有 push 與 pull_request 都跑，不只在 tag；一般 PR 就能擋下 Windows 迴歸。
  # 測試需要的資料由 require_data!() 判斷，缺資料就 skip，這裡不下載資料包：
  # 這支 job 驗的是「Windows 上編得過、跑得動」，資料內容由 linux／windows 的
  # 完整測試負責。
  test-windows:
    name: test-windows（Windows 測試）
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # 與 rust-toolchain.toml 同一版（action 不讀該檔案）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      # 32 位元的 TSF DLL。build.ps1 另外建 i686 產物，這裡先確認它能編過。
      - name: 加入 i686 target（32 位元 TSF DLL）
        shell: pwsh
        run: rustup target add i686-pc-windows-msvc

      # 與 ci-windows／release-windows 分開的 key：這支 job 會建 i686 產物，
      # 混用會讓另外兩個 job 還原到不對的 target 目錄。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-windows
          cache-targets: "true"
          cache-all-crates: "true"
          cache-on-failure: "true"

      # jc-settings-ui 依賴 GPUI，與 Linux job 一樣排除；它的 Windows 建置由
      # build-windows 負責。
      - name: Test（workspace）
        run: cargo test --workspace --no-fail-fast --exclude jc-settings-ui

      # 只挑 Windows 專屬與會碰到 Windows API 的 crate：Linux job 的
      # --workspace clippy 看不到這些分支。
      - name: Clippy（Windows 專屬 crate）
        run: >
          cargo clippy
          -p jc-tsf -p jc-windows -p jc-tsf-register -p jc-tsf-smoke -p jc-cli
          --all-targets -- -D warnings

      # 32 位元目標只做 check、不連結：i686 的 TSF DLL 由 build.ps1 建置，
      # 這裡只確認型別與 cfg(target_pointer_width) 分支編得過。
      - name: 32 位元型別檢查
        run: >
          cargo check
          -p jc-tsf -p jc-tsf-register -p jc-tsf-smoke
          --all-targets --target i686-pc-windows-msvc

      # installer/jc-tip-register 有自己的 [workspace]，不在 --workspace 裡，
      # 必須用 manifest path 單獨跑。
      - name: 安裝器自訂動作測試（獨立 workspace）
        run: cargo test --manifest-path installer/jc-tip-register/Cargo.toml --all-targets

  # 與測試同時起步。只 needs check-tag，不等 linux/windows 測試。
  #
  # 每次 push main 都建置並安裝一次：安裝器自己就是最常壞的地方，等發版才發現
  # 的代價遠高於每次多花六分鐘 Windows runner。有 tag 時同一個建置物直接進
  # publish；沒有 tag 時版本由 check-tag 從 Cargo.toml 補上，只做驗證。
  build-windows:
    name: build-windows（setup.exe）
    needs: check-tag
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      # RELEASE_VERSION 是完整版本（含 -rc.1），用於檔名與 Release 標題；
      # ISO_VERSION 只有三段數字，給 setup.exe 的 VersionInfoVersion。
      RELEASE_VERSION: ${{ needs.check-tag.outputs.version }}
      ISO_VERSION: ${{ needs.check-tag.outputs.iso_version }}
      # Windows 的 Python 3.12 預設 cp1252；build.ps1 呼叫 check-payload.py 時
      # 印中文不能爆，統一用 UTF-8。
      PYTHONUTF8: "1"
      # 單一來源：公開 repo variable。不放 secret，fork PR 也讀得到
      # 同一份資料包（見 docs/release.md）。
      DATA_BUNDLE_URL: ${{ vars.JC_DATA_BUNDLE_URL }}
      DATA_BUNDLE_SHA256: ${{ vars.JC_DATA_BUNDLE_SHA256 }}
    steps:
      - uses: actions/checkout@v5

      # 與 rust-toolchain.toml 同一版（action 不讀該檔案）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      # 32 位元的 TSF DLL：build.ps1 會另外建 i686-pc-windows-msvc 的 jc-tsf，
      # 讓舊版 Office 等 32 位元程式也載入得到輸入法。
      - name: 加入 i686 target（32 位元 TSF DLL）
        shell: pwsh
        run: rustup target add i686-pc-windows-msvc

      # 這個 job 同時建 x86_64 與 i686 兩份產物，用 key 標明主要 target，
      # 讓同一 runner 上的其他 Windows 快取不會與這份混淆。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
          key: x86_64-pc-windows-msvc
          cache-targets: "true"
          cache-all-crates: "false"
          cache-on-failure: "true"

      # rust-cache 的 key 不含版本，會把上一版的 target 目錄還原回來；
      # 若 cargo 判定指紋未變就不重編，build.ps1 會把還原的舊 jc_tsf.dll 裝進
      # 安裝包（0.1.2 的 pipe debug log 因此消失，見 fix-msi-stale-dll）。
      #
      # 只清自家 crate 的產物，不動第三方依賴的 rlib 與 fingerprint。全量刪
      # release 目錄會讓每個 job 連 400 多個依賴一起重編，發版要 20 分鐘以上；
      # 自家 crate 只有十幾個，重編不到兩分鐘。build.ps1 另有 mtime／SHA-256
      # 驗證把關，真的拿到舊檔會直接失敗而不是靜靜打包。
      - name: 清除快取的 release 產物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dir in @(
            'target\x86_64-pc-windows-msvc\release',
            'target\i686-pc-windows-msvc\release',
            'target\tip-register\x86_64-pc-windows-msvc\release'
          )) {
            if (-not (Test-Path $dir)) {
              Write-Host "略過 $dir（不存在）"
              continue
            }
            $removed = 0
            foreach ($sub in @($dir, "$dir\deps", "$dir\.fingerprint", "$dir\build")) {
              if (-not (Test-Path $sub)) { continue }
              Get-ChildItem -Path $sub -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like 'jc_*' -or $_.Name -like 'jc-*' } |
                ForEach-Object { Remove-Item $_.FullName -Recurse -Force; $removed++ }
            }
            Write-Host "清除 $dir 的自家 crate 產物：$removed 項"
          }

      # build.ps1 需要資料根目錄。資料不進 git，因此由此 job 下載
      # 預先打包的資料包；URL 由公開 repo variable 提供。
      - name: 下載並展開資料包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Add-GitHubEnv([string]$Name, [string]$Value) {
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          $url = $env:DATA_BUNDLE_URL
          if ([string]::IsNullOrWhiteSpace($url)) {
            throw @'
          沒有資料包 URL。setup.exe 需要資料根目錄（manifest.json 與 shipped: true 的檔案）。
          請將資料包上傳到 runner 讀得到的位置，並設定公開 repo variable
          JC_DATA_BUNDLE_URL。打包方式見 docs/release.md。
          打包方式見 docs/release.md。
          '@
          }

          $bundle = Join-Path $env:RUNNER_TEMP 'jc-ime-data-bundle'
          Invoke-WebRequest -Uri $url -OutFile $bundle

          if (-not [string]::IsNullOrWhiteSpace($env:DATA_BUNDLE_SHA256)) {
            $actual = (Get-FileHash -Algorithm SHA256 $bundle).Hash.ToLowerInvariant()
            $expected = $env:DATA_BUNDLE_SHA256.Trim().ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "資料包 SHA-256 不符：預期 $expected，實際 $actual"
            }
            Write-Host '資料包 SHA-256 通過'
          } else {
            Write-Warning '沒有設定 JC_DATA_BUNDLE_SHA256；跳過資料包雜湊檢查（manifest 內的檔案雜湊仍會驗）'
          }

          $root = Join-Path $env:RUNNER_TEMP 'jc-ime-data'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null

          if ($url -match '\.zip(\?|$)') {
            Expand-Archive -Path $bundle -DestinationPath $root -Force
          } else {
            & tar -xf $bundle -C $root
            if ($LASTEXITCODE -ne 0) {
              # Windows 內建 tar 不一定支援 zstd；有 7-Zip 就退回它。
              if ($url -match '\.(zst|tzst)(\?|$)') {
                Write-Warning 'Windows tar 無法解 zstd；改用 7-Zip。'
                Remove-Item $root -Recurse -Force
                New-Item -ItemType Directory -Path $root | Out-Null

                $sevenZip = @(
                  (Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'),
                  (Join-Path ${env:ProgramFiles(x86)} '7-Zip\7z.exe')
                ) | Where-Object { Test-Path $_ } | Select-Object -First 1
                if (-not $sevenZip) {
                  throw '找不到 7-Zip，且 Windows tar 不支援 .tar.zst；請把資料包改成 .tar.gz。'
                }
                $sevenWork = Join-Path $env:RUNNER_TEMP 'jc-ime-data-7z'
                if (Test-Path $sevenWork) { Remove-Item $sevenWork -Recurse -Force }
                New-Item -ItemType Directory -Path $sevenWork | Out-Null

                & $sevenZip x $bundle "-o$sevenWork" -y
                if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip 解開 zstd 失敗（exit $LASTEXITCODE）"
                }
                $tarFile = Get-ChildItem -Path $sevenWork -Filter '*.tar' -File -Recurse |
                  Select-Object -First 1
                if (-not $tarFile) {
                  throw '7-Zip 沒有產出 .tar；請把資料包改成 .tar.gz。'
                }
                & $sevenZip x $tarFile.FullName "-o$root" -y
                if ($LASTEXITCODE -ne 0) {
                  throw "7-Zip 解開 tar 失敗（exit $LASTEXITCODE）"
                }
              } else {
                throw "解開資料包失敗（tar exit $LASTEXITCODE）"
              }
            }
          }

          # 允許壓縮檔自帶一層 jc-ime-data/ 目錄。
          $dataRoot = $root
          if (-not (Test-Path (Join-Path $dataRoot 'manifest.json'))) {
            $candidates = @(Get-ChildItem -Path $root -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName 'manifest.json') })
            if ($candidates.Count -eq 1) {
              $dataRoot = $candidates[0].FullName
            }
          }
          if (-not (Test-Path (Join-Path $dataRoot 'manifest.json'))) {
            throw "資料包裡找不到 manifest.json（解開位置：$root）"
          }

          Add-GitHubEnv 'JC_DATA_ROOT' $dataRoot
          Write-Host "資料根目錄：$dataRoot"

      # Python 版與 `jc-cli data verify` 的 Full 驗證等價（見 scripts/verify-bundle.py），
      # 省掉為了驗證而單獨編一次 release jc-cli 的 5～6 分鐘。build.ps1 仍會建
      # 它需要的 crate。Windows runner 已有 Python，不必 setup-python。
      - name: 驗證資料包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/verify-bundle.py "$env:JC_DATA_ROOT"
          if ($LASTEXITCODE -ne 0) {
            throw "資料驗證失敗（exit $LASTEXITCODE）"
          }

      - name: 安裝 Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # ISCC 在 Program Files (x86)\Inno Setup 6；build.ps1 也會自己找，
          # 這裡放進 PATH 方便 log 直接顯示版本。
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "找不到 ISCC.exe：$iscc"
          }
          Split-Path -Parent $iscc | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # 簽章接口：有 SIGNING_PFX_BASE64 才簽；沒有就跳過，不讓流程失敗。
      - name: 準備簽章憑證
        id: signing
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Warning '沒有 SIGNING_PFX_BASE64；跳過簽章，產出未簽章 setup.exe。'
            'signed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'jc-ime-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "JC_SIGN_CERT=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            "JC_SIGN_PASSWORD=$($env:SIGNING_PFX_PASSWORD)" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          # Windows runner 的 signtool 不一定在 PATH；找 x64 版本加進去。
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem -Path $sdkRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($signtool) {
            $signtool.Directory.FullName |
              Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$($signtool.Directory.FullName);$env:PATH"
            Write-Host "使用 signtool：$($signtool.FullName)"
          } else {
            Write-Warning '找不到 x64 signtool.exe；build.ps1 會在簽章時失敗。'
          }

          'signed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 建置 setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 資料包只帶 shipped 檔案，但 manifest 仍是對完整資料根目錄產生的；
          # -Manifest 讓安裝包保留 shipped: false 的下載項與 URL。
          # -IsoVersion 給 VersionInfoVersion（x.y.z）；setup.exe 檔名用完整版本。
          .\installer\build.ps1 -DataRoot $env:JC_DATA_ROOT `
            -Manifest (Join-Path $env:JC_DATA_ROOT 'manifest.json') `
            -IsoVersion $env:ISO_VERSION

          $setup = Join-Path 'target\installer' "jc-ime-$env:RELEASE_VERSION-x64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "找不到預期的 setup.exe：$setup"
          }

          # Release 說明要讀資料版本，複製一份到 artifact 根目錄。
          Copy-Item 'target\installer\payload\data\manifest.json' `
            'target\installer\data-manifest.json' -Force

          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $setup)" |
            Set-Content -Path "$setup.sha256" -Encoding ascii

      - name: 上傳 Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-setup-${{ needs.check-tag.outputs.version }}
          if-no-files-found: error
          # 每次 push 都建一份，留七天就夠回看，不必占滿 artifact 額度。
          retention-days: 7
          path: |
            target/installer/jc-ime-${{ needs.check-tag.outputs.version }}-x64-setup.exe
            target/installer/jc-ime-${{ needs.check-tag.outputs.version }}-x64-setup.exe.sha256
            target/installer/data-manifest.json

  # 拿 build-windows 產出的 setup.exe 做一次真的安裝：裝、跑 jc-tsf-smoke、
  # 斷言 TSF 註冊與語言清單、再反安裝。Inno 的 AppId 固定，但檔案清單、
  # 自訂動作與登錄值只有真的裝一次才知道有沒有對上。
  #
  # needs 除了 build-windows 還要 check-tag：artifact 名稱與版本都來自
  # needs.check-tag.outputs.version，只寫 build-windows 會讓這裡取到空字串。
  # 條件與 build-windows 相同；PR 不跑（PR 的 event 是 pull_request）。
  install-smoke:
    name: install-smoke（安裝與反安裝）
    needs: [check-tag, build-windows]
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      # 已發行的 TSF 身分；與 crates/jc-tsf/src/guids.rs 相同。
      # 值給各步驟共用，避免四處重打字串打錯。
      JC_TIP_CLSID: "{2F6B41D8-9E07-4C3A-B5F1-8D2C6A9E0473}"
      JC_TIP_PROFILE: "{C4E8D217-5B3F-4A96-8E0C-7F1A2B3D4E56}"
      JC_INSTALL_DIR: C:\Program Files\jc-ime
    steps:
      - uses: actions/checkout@v5

      - name: 下載 Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-setup-${{ needs.check-tag.outputs.version }}
          path: dist/windows

      # setup.exe 卡住時 Start-Process -Wait 會一路等到 job 的 45 分鐘 timeout，
      # 什麼 log 都看不到；這裡自己等 10 分鐘，超時就中止並印 install.log。
      - name: 安裝 setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $setup = Get-ChildItem -Path 'dist\windows' -Filter '*-setup.exe' -File |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $setup) {
            throw 'dist\windows 底下找不到 *-setup.exe；artifact 下載失敗或檔名不符。'
          }
          Write-Host "安裝 $($setup.FullName)"

          $proc = Start-Process -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"" `
            -PassThru
          if (-not $proc.WaitForExit(600000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $log) { Get-Content $log -Tail 60 | Write-Host }
            throw 'setup.exe 安裝超過 10 分鐘；已強制中止，上面是 install.log 最後 60 行。'
          }

          $code = $proc.ExitCode
          if ($code -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 60 | Write-Host }
            if ($code -eq 4) {
              throw 'setup.exe 的 PrepareToInstall 失敗（exit 4）；通常是舊檔無法讓路，詳見 install.log。'
            }
            if ($code -eq 5) {
              throw 'setup.exe 在準備安裝階段被取消（exit 5）。'
            }
            throw "setup.exe 安裝失敗（exit $code）；install.log 最後 60 行已印在上面。"
          }
          Write-Host "setup.exe 安裝完成（exit $code）"

      - name: 斷言安裝檔案
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # x64 DLL、x86 DLL 與引擎都必須在 Program Files\jc-ime；缺任何一個，
          # 32 位元程式或引擎啟動就會失敗。
          foreach ($name in @('jc-tsf.dll', 'jc-tsf-x86.dll', 'jc-engine.exe')) {
            $path = Join-Path $env:JC_INSTALL_DIR $name
            if (-not (Test-Path $path)) { throw "安裝後找不到 $path" }
            Write-Host "$path 存在"
          }

      # jc-tsf-smoke 現在是安裝診斷工具：--json 輸出 jc-ime-doctor/1，
      # 內含 12 項檢查。除了結束碼，還要求關鍵項目的 status 不是 fail。
      - name: 執行 jc-tsf-smoke（doctor）
        shell: pwsh
        env:
          # Activate 失敗時 TSF 會在 DLL 裡記下是哪一步回錯誤。doctor 只看得到
          # HRESULT，真正的原因在 tsf.log。
          JC_TSF_LOG: "1"
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path $env:JC_INSTALL_DIR 'jc-tsf-smoke.exe'
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }

          $jsonPath = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $errPath = Join-Path $env:RUNNER_TEMP 'smoke.err.log'
          & $exe --json 1> $jsonPath 2> $errPath
          $code = $LASTEXITCODE
          if (Test-Path $jsonPath) { Get-Content $jsonPath | Write-Host }
          if (Test-Path $errPath) { Get-Content $errPath | Write-Host }

          if ($code -ne 0) {
            throw "jc-tsf-smoke 失敗（exit $code）；輸出見 $jsonPath 與 $errPath"
          }
          if (-not (Test-Path $jsonPath) -or (Get-Item $jsonPath).Length -eq 0) {
            throw 'jc-tsf-smoke --json 沒有輸出 JSON。'
          }

          $report = Get-Content $jsonPath -Raw | ConvertFrom-Json
          if ($report.schema -ne 'jc-ime-doctor/1') {
            throw "doctor schema 不是 jc-ime-doctor/1：$($report.schema)"
          }
          if (-not $report.ok) {
            $failed = @($report.checks | Where-Object { $_.status -eq 'fail' })
            foreach ($item in $failed) {
              Write-Host ("[FAIL] {0}：{1}" -f $item.id, $item.detail)
              if ($item.fix) { Write-Host ("       修復：{0}" -f $item.fix) }
            }
            throw "doctor 回報 $($failed.Count) 項失敗。"
          }

          # 這幾項是這次幾輪 bug 的根因，必須明確是 pass 或 warn（skip 不接受）。
          $required = @(
            'install.files',
            'registry.tip',
            'profile.machine',
            'profile.user',
            'profile.language_list'
          )
          foreach ($id in $required) {
            $item = $report.checks | Where-Object { $_.id -eq $id } | Select-Object -First 1
            if (-not $item) { throw "doctor 缺少必要檢查：$id" }
            if ($item.status -ne 'pass' -and $item.status -ne 'warn') {
              throw "doctor 檢查 $id 的 status 是 $($item.status)：$($item.detail)"
            }
            Write-Host ("[OK] {0} = {1}" -f $id, $item.status)
          }
          Write-Host "jc-tsf-smoke（doctor）通過"

      # 失敗時手動再跑一次 user-install，並把使用者語言清單整個倒出來。
      # InstallLayoutOrTip 的字串格式不對時會回 TRUE 但什麼都不寫，只有實際
      # 跑一次加完整 dump 才分得出是「沒呼叫到」還是「呼叫了沒效果」。
      - name: 診斷：手動跑 user-install 並倒出語言清單
        if: failure()
        shell: pwsh
        run: |
          $exe = Join-Path $env:JC_INSTALL_DIR 'jc-tip-register.exe'
          Write-Host '== 直接執行 user-install =='
          & $exe user-install 2>&1 | Out-String | Write-Host
          Write-Host "exit=$LASTEXITCODE"
          Write-Host '== HKCU User Profile =='
          reg query 'HKCU\Control Panel\International\User Profile' /s
          Write-Host '== TSF log =='
          $tsfLog = Join-Path $env:LOCALAPPDATA 'jc-ime\tsf.log'
          if (Test-Path $tsfLog) {
            Copy-Item $tsfLog (Join-Path $env:RUNNER_TEMP 'tsf.log') -Force
            Get-Content $tsfLog -Tail 120 | Write-Host
          } else {
            Write-Host "找不到 $tsfLog（JC_TSF_LOG 沒生效或目錄不同）"
          }

      - name: 斷言 TSF 註冊與語言清單
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $profileKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{0}\LanguageProfile\0x00000404\{1}' -f $env:JC_TIP_CLSID, $env:JC_TIP_PROFILE

          # SYSTEM 身分註冊的 profile：Enable 由 Windows 的
          # EnableLanguageProfile 寫成 DWORD 1，字串比對同時接受 REG_SZ。
          if (-not (Test-Path $profileKey)) { throw "缺少 profile 機碼：$profileKey" }
          $enable = (Get-ItemProperty -Path $profileKey -Name 'Enable' -ErrorAction SilentlyContinue).Enable
          if ("$enable" -ne '1') { throw "$profileKey 的 Enable 不是 1（實際：$enable）" }
          Write-Host "profile 機碼存在，Enable=1：$profileKey"

          # 32 位元檢視。CTF 機碼不是 WOW64 轉向機碼，兩個檢視應該看得到同一份；
          # 用 /reg:32 明示，才不會被 PowerShell 的預設檢視掩蓋。
          & reg query "HKLM\SOFTWARE\Microsoft\CTF\TIP\$env:JC_TIP_CLSID\LanguageProfile\0x00000404\$env:JC_TIP_PROFILE" /reg:32 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "32 位元檢視看不到 profile 機碼（reg query /reg:32 exit $LASTEXITCODE）"
          }
          Write-Host '32 位元檢視的 profile 機碼存在'

          # 使用者的語言清單。user-install 以 runasoriginaluser 執行，這裡是同一個
          # 使用者，應該看得到 0404:{profile}。
          $tips = @(Get-WinUserLanguageList | ForEach-Object { $_.InputMethodTips })
          Write-Host "目前語言清單：$($tips -join ', ')"
          $matched = @($tips | Where-Object {
            $_.StartsWith('0404:') -and $_.Contains($env:JC_TIP_PROFILE)
          })
          if ($matched.Count -eq 0) {
            throw "Get-WinUserLanguageList 的 InputMethodTips 沒有 0404:$env:JC_TIP_PROFILE"
          }
          Write-Host "語言清單含 $($matched -join ', ')"

      - name: 反安裝 setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $log = Join-Path $env:RUNNER_TEMP 'uninstall.log'
          $uninstaller = Join-Path $env:JC_INSTALL_DIR 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "找不到反安裝程式：$uninstaller" }

          # TSF DLL 被載入時 Inno 會把刪除排到重開機，或留下檔案；先停掉引擎與
          # explorer。runner 重開 explorer 不會影響後續步驟。
          Get-Process -Name 'jc-engine' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'explorer' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $proc = Start-Process -FilePath $uninstaller `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"" `
            -PassThru
          if (-not $proc.WaitForExit(600000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $log) { Get-Content $log -Tail 60 | Write-Host }
            throw 'unins000.exe 超過 10 分鐘；已強制中止，上面是 uninstall.log 最後 60 行。'
          }

          $code = $proc.ExitCode
          if ($code -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 60 | Write-Host }
            throw "unins000.exe 反安裝失敗（exit $code）；uninstall.log 最後 60 行已印在上面。"
          }
          Write-Host "unins000.exe 反安裝完成（exit $code）"

          # explorer 被停掉只是為了讓 DLL 可刪；重開它，讓 runner 回到原狀。
          Start-Process -FilePath explorer.exe -ErrorAction SilentlyContinue

      - name: 斷言反安裝乾淨
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path $env:JC_INSTALL_DIR) {
            Get-ChildItem $env:JC_INSTALL_DIR -Recurse | Select-Object -First 20 | Write-Host
            $left = @(Get-ChildItem $env:JC_INSTALL_DIR -Recurse -File -ErrorAction SilentlyContinue)
            if ($left.Count -gt 0) {
              throw "反安裝後 $env:JC_INSTALL_DIR 還有 $($left.Count) 個檔案。"
            }
            throw "反安裝後 $env:JC_INSTALL_DIR 仍然存在（空目錄）。"
          }
          Write-Host "$env:JC_INSTALL_DIR 已移除"

          # Inno 的解除安裝項目由 AppId 管理；反安裝後不該還在「應用程式與功能」。
          $uninstallRoots = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          foreach ($root in $uninstallRoots) {
            foreach ($item in @(Get-ChildItem $root -ErrorAction SilentlyContinue)) {
              $props = Get-ItemProperty -Path $item.PSPath -ErrorAction SilentlyContinue
              if ($props.DisplayName -like 'jc 注音*') {
                throw "反安裝後解除安裝登錄仍有 jc 注音：$($item.PSPath)"
              }
            }
          }
          Write-Host '解除安裝登錄已清空'

          $runValue = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'jc-ime-engine' -ErrorAction SilentlyContinue).'jc-ime-engine'
          if ($null -ne $runValue) { throw '反安裝後 Run 值 jc-ime-engine 仍在。' }
          Write-Host 'Run 值 jc-ime-engine 已移除'

          # UnregisterTip 以 SYSTEM 身分移除 HKLM 的 profile；沒清掉會讓下一個
          # 版本升級時看到半套註冊。
          $profileKey = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{0}\LanguageProfile\0x00000404\{1}' -f $env:JC_TIP_CLSID, $env:JC_TIP_PROFILE
          if (Test-Path $profileKey) { throw "反安裝後 profile 機碼仍在：$profileKey" }
          Write-Host 'profile 機碼已移除'

          & reg query "HKLM\SOFTWARE\Microsoft\CTF\TIP\$env:JC_TIP_CLSID\LanguageProfile\0x00000404\$env:JC_TIP_PROFILE" /reg:32 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw '反安裝後 32 位元檢視的 profile 機碼仍在。'
          }
          Write-Host '32 位元檢視的 profile 機碼已移除'

      # 失敗時把 log 留下來：install.log 有自訂動作的完整輸出，
      # smoke.json 有 12 項 doctor 檢查的逐項結果。
      - name: 上傳失敗記錄
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: install-smoke-logs-${{ needs.check-tag.outputs.version }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/uninstall.log
            ${{ runner.temp }}/smoke.json
            ${{ runner.temp }}/smoke.err.log
            ${{ runner.temp }}/tsf.log


  # 與 build-windows 相同：只 needs check-tag，與測試並行起步。
  build-linux:
    name: build-linux（tar.gz）
    needs: check-tag
    if: github.event_name == 'push' && needs.check-tag.outputs.has_tag == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # 收尾清理需要刪快取的權限；job 層級覆蓋 workflow 的 contents: read。
    permissions:
      contents: read
      actions: write
    env:
      RELEASE_VERSION: ${{ needs.check-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # 與 rust-toolchain.toml 同一版（action 不讀該檔案）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: 系統依賴（GPUI Kit 的 X11／Wayland／字型）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev

      # release 只快取依賴，不快取 workspace 產物：一份太大，會擠掉其他快取。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
          cache-targets: "true"
          cache-all-crates: "false"
          cache-on-failure: "true"

      - name: 建置 Linux 執行檔
        run: cargo build --release -p jc-engine -p jc-cli -p jc-settings-ui

      - name: 打包 tar.gz
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION}"
          pkg="jc-ime-${version}-linux-x86_64"
          stage="target/release-package/${pkg}"

          rm -rf "target/release-package/${pkg}"
          mkdir -p "${stage}/bin" "${stage}/docs"

          install -m 0755 target/release/jc-engine "${stage}/bin/jc-engine"
          install -m 0755 target/release/jc-cli "${stage}/bin/jc-cli"
          install -m 0755 target/release/jc-settings-ui "${stage}/bin/jc-settings-ui"

          cp LICENSE NOTICE "${stage}/"
          cp -R legal "${stage}/legal"
          cp docs/install.md "${stage}/docs/install.md"

          tar -C target/release-package -czf "target/release-package/${pkg}.tar.gz" "${pkg}"
          (
            cd target/release-package
            sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
          )

          echo "產出：target/release-package/${pkg}.tar.gz"
          cat "target/release-package/${pkg}.tar.gz.sha256"

      - name: 上傳 Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-tar-${{ needs.check-tag.outputs.version }}
          if-no-files-found: error
          path: |
            target/release-package/jc-ime-${{ needs.check-tag.outputs.version }}-linux-x86_64.tar.gz
            target/release-package/jc-ime-${{ needs.check-tag.outputs.version }}-linux-x86_64.tar.gz.sha256

      # 收尾清理舊快取：只在 main 跑，build 與 publish 都在 main scope。
      # 清理失敗不讓 build 變紅；並行 run 的快取由 skip-recent-hours 保護。
      - name: 清理舊快取
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/cache-prune.sh --skip-recent-hours 6


  # 等 check-tag、三個測試、兩個 build 與安裝 smoke 都完成才發版；
  # 任一測試或安裝驗證失敗就不發版。
  publish:
    name: publish（GitHub Release）
    # 只有帶 annotated tag 的 push main 會執行。needs 包含三個測試、兩個
    # build job 與 install-smoke；任一失敗就不發版，不必再查 CI run。
    # 安裝 smoke 會實際安裝與反安裝 setup.exe，壞掉的安裝包不該發出去。
    if: github.event_name == 'push' && needs.check-tag.outputs.has_tag == 'true'
    needs: [check-tag, linux, windows, test-windows, build-windows, build-linux, install-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: 下載 Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-setup-${{ needs.check-tag.outputs.version }}
          path: dist/windows

      - name: 下載 Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-tar-${{ needs.check-tag.outputs.version }}
          path: dist/linux

      - name: 產生 Release 說明
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check-tag.outputs.version }}
          ISO_VERSION: ${{ needs.check-tag.outputs.iso_version }}
          SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION}"
          iso_version="${ISO_VERSION}"
          prerelease_args=()
          if [[ "${version}" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi
          date_utc=$(date -u +%Y-%m-%d)
          data_version=$(python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/windows/data-manifest.json").read_text(encoding="utf-8"))
          print(manifest.get("version", "unknown"))
          PY
          )

          changelog=$(mktemp)
          notes=$(mktemp)
          trap 'rm -f "${changelog}" "${notes}"' EXIT

          awk -v ver="${version}" '
            /^## / {
              if (found) exit
              heading = $0
              sub(/^##[[:space:]]+/, "", heading)
              split(heading, parts, /[[:space:]]+/)
              if (parts[1] == ver) {
                found = 1
                next
              }
            }
            found { print }
          ' docs/CHANGELOG.md > "${changelog}"

          if [[ ! -s "${changelog}" ]]; then
            printf '本版沒有 CHANGELOG 條目；請看 commit 記錄。\n' > "${changelog}"
          fi

          {
            printf '## 版本\n\n`%s`（%s）\n\n' "${version}" "${date_utc}"
            if [[ "${iso_version}" != "${version}" ]]; then
              printf '這是 pre-release。setup.exe 的顯示版本與檔名是 `%s`，\n' "${version}"
              printf '檔案內嵌的 VersionInfoVersion 只有 `%s`（四段數字）。\n\n' "${iso_version}"
            fi
            printf '## 模型與資料版本\n\n`%s`（安裝包內 `data/manifest.json`，涵蓋詞典與模型）\n\n' "${data_version}"
            printf '## 變更摘要\n\n'
            cat "${changelog}"
            printf '\n## 下載\n\n'
            printf '| 平台 | 檔案 |\n|---|---|\n'
            printf '| Windows x64 | `jc-ime-%s-x64-setup.exe` |\n' "${version}"
            printf '| Linux x86_64 | `jc-ime-%s-linux-x86_64.tar.gz` |\n\n' "${version}"
            printf '每個檔案旁都附 `.sha256`，下載後請先核對。\n\n'
            printf '## 簽章\n\n'
            if [[ "${SIGNED}" == "true" ]]; then
              printf 'Windows 執行檔與 setup.exe 已使用專案憑證簽章。\n\n'
            else
              printf '**未簽章**：本次沒有簽章憑證。Windows 可能顯示 SmartScreen 警告；\n'
              printf '企業的 AppLocker／WDAC 白名單也會擋下未簽章安裝程式。\n\n'
            fi
            printf '## 已知限制\n\n'
            printf -- '- Windows TIP 同時包含 x64 與 x86 兩份 DLL，共用同一個「jc 注音」項目；32 位元程式（例如舊版 Office）不需要手動切換。\n'
            printf -- '- 安裝程式是 per-machine，需要系統管理員；只會把輸入法加進執行安裝的帳號。\n'
            printf -- '- 注音神經選字模型（Funmula `zh-select`）依授權不隨附，需另外下載。\n'
            printf -- '- Linux 版目前只有引擎、CLI 與設定程式，沒有桌面輸入法整合。\n'
            printf -- '- 設定變更後要重新啟動引擎才會生效。\n'
            printf -- '- Windows 實機安裝、升級、反安裝與 UWP／Office 相容性仍需人工驗證。\n'
          } > "${notes}"

          echo "Release 說明："
          cat "${notes}"

          assets=(
            "dist/windows/jc-ime-${version}-x64-setup.exe"
            "dist/windows/jc-ime-${version}-x64-setup.exe.sha256"
            "dist/linux/jc-ime-${version}-linux-x86_64.tar.gz"
            "dist/linux/jc-ime-${version}-linux-x86_64.tar.gz.sha256"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "::error::缺少 release asset：${asset}"
              exit 1
            fi
          done

          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} 已存在；更新說明並覆蓋 assets。"
            gh release edit "v${version}" --title "${version}" \
              --notes-file "${notes}" "${prerelease_args[@]}"
            gh release upload "v${version}" "${assets[@]}" --clobber
          else
            gh release create "v${version}" "${assets[@]}" \
              --title "${version}" \
              --notes-file "${notes}" \
              --verify-tag "${prerelease_args[@]}"
          fi
