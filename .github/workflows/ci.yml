name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  # 增量編譯對 CI 沒有好處，關掉可少寫很多暫存檔。
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: linux (core)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # Windows 目標的型別檢查用；不需要 MSVC 工具鏈。
          targets: x86_64-pc-windows-msvc
      - name: 系統依賴（GPUI Kit 的 X11／Wayland／字型）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev
      # 只快取下載回來的 registry／git，不快取 target：
      # target 太大，上傳下載的時間比重新編譯還久。
      - name: Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Windows 目標型別檢查
        # 用 Windows target 跑型別檢查，補上 Linux 建置看不到的 `cfg(windows)`
        # 分支。只做 check、不連結，所以 Linux runner 不需要 MSVC 工具鏈。
        #
        # 兩個 crate 不在這裡檢查，它們的 C 相依需要 MSVC 的 C 編譯器與 Windows
        # SDK，Linux runner 沒有：
        # - `jc-cli`：ureq → rustls → ring
        # - `jc-settings-ui`：GPUI（資源檔需要 resource compiler，另有 C 相依）
        # 這兩個 crate 的 Windows 建置由 windows (msvc) job 負責。
        run: >
          cargo check --workspace --all-targets
          --exclude jc-cli --exclude jc-settings-ui
          --target x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --workspace

  windows:
    name: windows (msvc)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # 只跑 test（debug）。原本先 build --release 再 test，等於同一份程式編兩次；
      # release 建置改由 release workflow 在標籤上做。
      - name: Test
        run: cargo test --workspace
