name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  # 增量編譯對 CI 沒有好處，關掉可少寫很多暫存檔。
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: linux (core)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 收尾清理需要刪快取的權限；job 層級覆蓋 workflow 的 contents: read。
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # Windows 目標的型別檢查用；不需要 MSVC 工具鏈。
          targets: x86_64-pc-windows-msvc
      - name: 系統依賴（GPUI Kit 的 X11／Wayland／字型）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev
      # 依賴建置快取。rust-cache 只留依賴的產物，workspace crate 每次重編，
      # 也一併快取 ~/.cargo 的 registry／git，因此不再另外用 actions/cache。
      # 第一次跑不會命中（見 docs/release.md 的快取章節）。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux
          cache-targets: "true"
          cache-on-failure: "true"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Windows 目標型別檢查
        # 用 Windows target 跑型別檢查，補上 Linux 建置看不到的 `cfg(windows)`
        # 分支。只做 check、不連結，所以 Linux runner 不需要 MSVC 工具鏈。
        #
        # 兩個 crate 不在這裡檢查，它們的 C 相依需要 MSVC 的 C 編譯器與 Windows
        # SDK，Linux runner 沒有：
        # - `jc-cli`：ureq → rustls → ring
        # - `jc-settings-ui`：GPUI（資源檔需要 resource compiler，另有 C 相依）
        # 這兩個 crate 的 Windows 建置由 windows (msvc) job 負責。
        run: >
          cargo check --workspace --all-targets
          --exclude jc-cli --exclude jc-settings-ui
          --target x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --workspace

      # 收尾清理舊快取：只在 main 跑，PR 不動快取。清理失敗不讓 build 變紅。
      # 並行 run 可能正在使用既有快取，腳本預設跳過建立未滿 6 小時的項目。
      - name: 清理舊快取
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/cache-prune.sh --skip-recent-hours 6

  windows:
    name: windows (msvc)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 與 ci-linux 分開的 key，避免 Linux／Windows 互相覆蓋快取。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows
          cache-targets: "true"
          cache-on-failure: "true"
      # 只跑 test（debug）。原本先 build --release 再 test，等於同一份程式編兩次；
      # release 建置改由 release workflow 在標籤上做。
      - name: Test
        run: cargo test --workspace
