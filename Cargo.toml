[workspace]
resolver = "2"
members = [
    "crates/jc-core",
    "crates/jc-testdata",
    "crates/jc-data",
    "crates/jc-model",
    "crates/jc-proto",
    "crates/jc-platform",
    "crates/jc-eval",
    "crates/jc-engine",
    "crates/jc-windows",
    "crates/jc-linux",
    "crates/jc-mac",
    "crates/jc-cli",
    "crates/jc-jadic",
    "crates/jc-englishpack",
    "crates/jc-settings",
    "crates/jc-tsf",
    "crates/jc-tsf-register",
    "crates/jc-settings-ui",
    "crates/jc-tsf-smoke",
    "crates/jc-ui",
]

[workspace.package]
version = "0.1.17"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
memmap2 = "0.9"
log = "0.4"
env_logger = "0.11"
