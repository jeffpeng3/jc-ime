[workspace]
resolver = "2"
members = [
    "crates/jc-core",
    "crates/jc-testdata",
    "crates/jc-data",
    "crates/jc-model",
    "crates/jc-proto",
    "crates/jc-platform",
    "crates/jc-eval",
    "crates/jc-engine",
    "crates/jc-engine-launcher",
    "crates/jc-windows",
    "crates/jc-linux",
    "crates/jc-mac",
    "crates/jc-cli",
    "crates/jc-jadic",
    "crates/jc-englishpack",
    "crates/jc-settings",
    "crates/jc-tsf",
    "crates/jc-tsf-register",
    "crates/jc-settings-ui",
    "crates/jc-tsf-smoke",
]

# 出貨執行檔：strip 符號、thin LTO 換體積。panic = abort 讓執行檔 panic 時
# 直接結束（不印 backtrace）；只有不被宿主載入、也不靠 catch_unwind 保命的
# 程式可以吃這個 profile。codegen-units 維持預設 16：實測改成 1 只再少
# 2～11%（Windows）／10～14%（Linux），wall time 卻多約 20%，以 CI 時間優先。
[profile.release]
strip = "symbols"
lto = "thin"
panic = "abort"

# TSF DLL 不能 abort：它用 catch_unwind 攔下 COM 邊界的 panic，避免拖垮宿主
# 程式（explorer、Office 等）。其餘設定沿用 release。
#
# 注意：cargo 對 `cdylib + rlib` 的 unit 在 windows-msvc 不會傳 `-C lto=thin`，
# 所以 DLL 實際只吃到 `strip`，不是 thin LTO；而且 strip 之後 DLL 也沒有
# backtrace 符號。看到這個 profile 不代表 DLL 有 LTO。
[profile.tsf]
inherits = "release"
panic = "unwind"

[workspace.package]
version = "0.1.33"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
memmap2 = "0.9"
log = "0.4"
env_logger = "0.11"
