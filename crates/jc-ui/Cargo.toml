[package]
name = "jc-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "候選窗：jc-ui.exe 在自己的行程繪製，TSF DLL 經 named pipe 送 UiMessage（移植自 0c-ui）"

[lib]
name = "jc_ui"
path = "src/lib.rs"

[[bin]]
name = "jc-ui"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# 繪製、pipe 與 SID 只用在 Windows。Linux 的 `cargo check -p jc-ui --all-targets`
# 只編 message.rs／retire.rs 這些純資料與 std 部分；其餘模組由 lib.rs 的
# #[cfg(windows)] 擋掉，所以 Windows 相依全部掛在 target-specific 之下。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # color_text.rs 的彩色 Emoji 走 Direct2D／DirectWrite。
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
