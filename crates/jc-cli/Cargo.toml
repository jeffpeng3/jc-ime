[package]
name = "jc-cli"
default-run = "jc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# 轉發到 `jc-core` 的日文 reranker 接線；預設建置不拉入 ONNX Runtime。
onnx = ["jc-core/onnx"]

[dependencies]
jc-core = { path = "../jc-core" }
jc-data = { path = "../jc-data" }
jc-eval = { path = "../jc-eval" }
jc-testdata = { path = "../jc-testdata" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
