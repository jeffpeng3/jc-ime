[package]
name = "jc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
jc-core = { path = "../jc-core" }
jc-data = { path = "../jc-data" }
jc-model = { path = "../jc-model" }
jc-proto = { path = "../jc-proto" }
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true

[dev-dependencies]
serde_json.workspace = true
jc-testdata = { path = "../jc-testdata" }

# Windows named pipe 的 blocking Win32 API；只在 Windows 目標編譯。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
