[package]
name = "jc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
interprocess = "2.4.9"
jc-core = { path = "../jc-core" }
jc-data = { path = "../jc-data" }
jc-model = { path = "../jc-model" }
jc-proto = { path = "../jc-proto" }
jc-settings = { path = "../jc-settings" }
jc-windows = { path = "../jc-windows" }
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jc-testdata = { path = "../jc-testdata" }

# Windows 的 SDDL 序列化需要 widestring；其餘平台用不到。
[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # supervise 測試註冊視窗類別用到的 WNDCLASSW 掛在這個 feature 底下。
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# 監督者送 SIGTERM 給子行程；Windows 用 console 事件，不需要這個。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
