[package]
name = "jc-tsf-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "jc-tsf.dll 的安裝診斷工具（只能在 Windows 執行）"

[[bin]]
name = "jc-tsf-smoke"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
thiserror = { workspace = true }
sha2 = "0.10"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  # CONNECT_E_ADVISELIMIT：TIP 已被 msctf 激活的判定。
  "Win32_System_Ole",
  "Win32_System_Registry",
  # ITfInputProcessorProfileMgr::GetActiveProfile 與 TF_INPUTPROCESSORPROFILE。
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
] }
jc-proto = { path = "../jc-proto" }
jc-windows = { path = "../jc-windows" }
