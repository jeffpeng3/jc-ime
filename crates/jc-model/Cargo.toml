[package]
name = "jc-model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# SentencePiece 的 `.model` 是 protobuf；只解推論需要的欄位，不引入 C++ 相依。
prost = "0.14"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# `nmt_nfkc` 系列規則的字元折疊。
unicode-normalization = "0.1"
# candle：reranker 的推論後端。CPU 後端，不啟用 cuda/metal/mkl。
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
# Jinen v2 是 Qwen3 架構的 GGUF；量化 forward 直接沿用 candle 的實作。
candle-transformers = { version = "0.11", default-features = false }
# Jinen 的 tokenizer.json 是 BPE（NFKC＋Digits、byte_fallback）。
tokenizers = { version = "0.23", default-features = false }
# encoder 的 linear 以輸出維度切給 rayon 平行；只用在 candle 路徑。
rayon = "1"
[dev-dependencies]
jc-testdata = { path = "../jc-testdata" }

[[bin]]
name = "candle-quant"
path = "src/bin/candle-quant.rs"
