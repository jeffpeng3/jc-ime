[package]
name = "jc-tsf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows TSF 文字服務骨架（COM 註冊、按鍵、組字、提交、非同步 IPC）"

[lib]
crate-type = ["cdylib"]

[features]
# 讓 release 建置也能帶上 `jc_test_key`（冒煙測試用）；預設關閉。
test-export = []

# 整個 crate 在非 Windows 只剩 `#![cfg(windows)]` 的空殼（cdylib 沒有任何符號），
# 所以相依套件全部掛在 cfg(windows) 之下：Linux 的 `cargo check --workspace`
# 不會去編 `windows`、`jc-windows` 這些只給 Windows 用的東西。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
jc-core = { path = "../jc-core" }
jc-proto = { path = "../jc-proto" }
jc-windows = { path = "../jc-windows" }
