[package]
name = "jc-tsf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "0c 架構移植的 Windows TSF 文字服務（COM 外殼、註冊、候選窗、IPC）"

[lib]
# DLL 本體是 cdylib；rlib 讓 host test 與其他 crate 能引用型別。
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
jc-proto = { path = "../jc-proto" }
# log.rs 在非 Windows 也要用到 windows_core 的 Result／HRESULT 型別。
windows-core = "0.62"

# session.rs 本身不直接呼叫 Win32；真正的 overlapped I/O Client 是 T2 的範圍。
# 這裡先固定 jc 使用的 0.62，T2 在 Transport 實作中使用。
# T0：windows-core 是直接依賴，供 #[implement] 展開使用；不依賴 windows-link，
# 0c msctf.rs 的 windows_link::link! 到 T6 才需要改成 windows_core::link!。
[target.'cfg(windows)'.dependencies]
# T12a：候選窗協定型別（UiMessage/UiCandidate）與繪製共用 jc-ui，DLL 側不重複定義。
jc-ui = { path = "../jc-ui" }
# T10a：共用 jc-tsf-register 的 Registration／register_with()／unregister_with()。
# COM 匯出只定義在本 DLL，jc-tsf-register 只產 rlib，不會有 LNK2005 重複符號。
jc-tsf-register = { path = "../jc-tsf-register" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  # edit.rs 的 VARIANT 被 cfg(all(Com, Ole, Variant)) 擋住，三個都要開。
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  # caret.rs 的 GetDpiForWindow。
  "Win32_UI_HiDpi",
  # cuas.rs 的 ImmGetContext／ImmGetHotKey／ImmNotifyIME／ImmReleaseContext。
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  # edit.rs 的 ITfContext／ITfRange／ITfComposition 與 TF_* 常數。
  "Win32_UI_TextServices",
  # privacy.rs 的 GetClassNameW／GetWindowLongW／SendMessageW 與 ES_*／STATE_SYSTEM_*，
  # 以及 host tests 的 CreateWindowExW／GetGUIThreadInfo／ClientToScreen。
  "Win32_UI_WindowsAndMessaging",
] }
