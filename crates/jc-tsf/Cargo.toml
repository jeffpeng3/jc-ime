[package]
name = "jc-tsf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows TSF 文字服務骨架（COM 註冊、按鍵、組字、提交、非同步 IPC）"

[lib]
# rlib 讓 jc-tsf-next 能直接引用 register::Registration／register_with()。
# 兩個 crate 各自的 DllGetClassObject 等匯出不能同時進同一份 DLL，所以
# jc-tsf 的 COM 匯出用 dll-exports feature 包住；jc-tsf-next 關掉預設功能。
crate-type = ["cdylib", "rlib"]

[features]
default = ["dll-exports"]
# jc-tsf.dll 自己作為 cdylib 時才需要這些 COM 匯出。以 rlib 被 jc-tsf-next
# 相依時關掉，避免兩邊的 DllGetClassObject 等符號重複。
dll-exports = []
# 讓 release 建置也能帶上 `jc_test_key`（冒煙測試用）；預設關閉。
test-export = []

# 整個 crate 在非 Windows 只剩 `#![cfg(windows)]` 的空殼（cdylib 沒有任何符號），
# 所以相依套件全部掛在 cfg(windows) 之下：Linux 的 `cargo check --workspace`
# 不會去編 `windows`、`jc-windows` 這些只給 Windows 用的東西。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  # ExpandEnvironmentStringsW：展開 Run 機碼的 REG_EXPAND_SZ（%LOCALAPPDATA%）。
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  # VARIANT 被 cfg(all(Com, Ole)) 擋住；少了 Ole 會編不過。
  "Win32_System_Ole",
  "Win32_System_Registry",
  # GetCurrentThreadId：Activate／advise 日誌用來確認在同一執行緒。
  "Win32_System_Threading",
  # RegCreateKeyExW 與 VARIANT 都掛在 Win32_Security 之下；少了它會編不過。
  "Win32_Security",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` 展開後的程式碼直接引用 `windows_core`，必須是直接依賴。
windows-core = "0.62"
jc-core = { path = "../jc-core" }
jc-proto = { path = "../jc-proto" }
jc-windows = { path = "../jc-windows" }
