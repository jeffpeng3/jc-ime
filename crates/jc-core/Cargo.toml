[package]
name = "jc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# 開啟後才拉入注音選字模型與日文 reranker，以及 ONNX Runtime；
# 預設建置不應下載或連結 ONNX Runtime。
onnx = ["dep:jc-model", "dep:ort", "jc-model/onnx"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
log.workspace = true
crc32fast = "1"
unicode-script = "0.5"
unicode_categories = "0.1"
jc-data = { path = "../jc-data" }
jc-model = { path = "../jc-model", optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "std",
    "load-dynamic",
    "api-31",
], optional = true }

[dev-dependencies]
jc-testdata = { path = "../jc-testdata" }
