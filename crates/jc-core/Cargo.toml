[package]
name = "jc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# 開啟後才把日文 reranker 接進 N-best 重排，並拉入 `jc-model/onnx`。
onnx = ["dep:jc-model", "jc-model/onnx"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
log.workspace = true
unicode-script = "0.5"
unicode_categories = "0.1"
jc-data = { path = "../jc-data" }
jc-model = { path = "../jc-model", optional = true }

[dev-dependencies]
jc-testdata = { path = "../jc-testdata" }
