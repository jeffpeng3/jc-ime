[package]
name = "jc-tsf-next"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "0c session.rs 移植與 jc State → 0c Snapshot 轉換層（adapter spike，不進 TSF／註冊）"

[lib]
# 新版 DLL 自己也是 cdylib；rlib 讓 host test 與其他 crate 能引用型別。
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
jc-proto = { path = "../jc-proto" }
# log.rs 在非 Windows 也要用到 windows_core 的 Result／HRESULT 型別。
windows-core = "0.62"

# session.rs 本身不直接呼叫 Win32；真正的 overlapped I/O Client 是 T2 的範圍。
# 這裡先固定 jc 使用的 0.62，T2 在 Transport 實作中使用。
# T0：windows-core 是直接依賴，供 #[implement] 展開使用；不依賴 windows-link，
# 0c msctf.rs 的 windows_link::link! 到 T6 才需要改成 windows_core::link!。
[target.'cfg(windows)'.dependencies]
# T10a：借用 jc-tsf 已參數化的 register::Registration／register_with()／
# unregister_with()。關掉預設功能，避免它的 DllGetClassObject 等匯出進到新版 DLL。
jc-tsf = { path = "../jc-tsf", default-features = false }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  # edit.rs 的 VARIANT 被 cfg(all(Com, Ole, Variant)) 擋住，三個都要開。
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  # caret.rs 的 GetDpiForWindow。
  "Win32_UI_HiDpi",
  # cuas.rs 的 ImmGetContext／ImmGetHotKey／ImmNotifyIME／ImmReleaseContext。
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  # edit.rs 的 ITfContext／ITfRange／ITfComposition 與 TF_* 常數。
  "Win32_UI_TextServices",
  # privacy.rs 的 GetClassNameW／GetWindowLongW／SendMessageW 與 ES_*／STATE_SYSTEM_*，
  # 以及 host tests 的 CreateWindowExW／GetGUIThreadInfo／ClientToScreen。
  "Win32_UI_WindowsAndMessaging",
] }
